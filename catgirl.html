```html
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAYDERSITE</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <main>
        <div class="
            relative
            flex
            min-h-screen
            w-full
            items-center
            justify-center
            overflow-hidden
            bg-gradient-to-br
            from-pink-300
            via-purple-300
            to-blue-600
            px-4
            py-20
        ">

            <!-- Декоративные элементы -->

            <div class="
                absolute
                left-5
                top-10
                text-3xl
                animate-bounce

                sm:left-10
                sm:top-20
                sm:text-4xl

                md:left-20
            ">
                ♡
            </div>

            <div class="
                absolute
                right-5
                top-20
                text-2xl

                sm:right-10
                sm:top-32
                sm:text-3xl

                md:right-20
            ">
                ✦
            </div>

            <div class="
                absolute
                bottom-20
                left-5
                text-4xl

                sm:left-10
                sm:text-5xl

                md:left-20
            ">
                ♡
            </div>

            <div class="
                absolute
                bottom-16
                right-5
                text-3xl

                sm:right-10
                sm:text-4xl

                md:right-20
            ">
                ✧
            </div>


            <!-- Карточка -->

            <div class="
                relative
                flex
                w-full
                max-w-xs
                flex-col
                items-center
                overflow-hidden
                rounded-3xl
                border
                border-white/60
                bg-white/90
                p-4
                shadow-2xl
                backdrop-blur-sm
                transition
                duration-300
                hover:shadow-pink-500/40

                sm:max-w-sm
                sm:p-5

                md:hover:scale-105
            ">

                <!-- Фото -->

                <img
                    class="
                        aspect-square
                        w-full
                        max-w-[220px]
                        rounded-2xl
                        border-2
                        border-white
                        object-cover
                        shadow-lg

                        sm:max-w-[240px]
                    "
                    src="https://i.pinimg.com/736x/a7/f3/21/a7f321917939208c9bca5366511368bb.jpg"
                    alt="Фото"
                >


                <!-- Текст -->

                <h2 class="
                    mt-4
                    text-center
                    text-xl
                    font-bold
                    text-gray-800

                    sm:text-2xl
                ">
                    Ти май люпими 👇
                </h2>


                <!-- Кнопка -->

                <a
                    class="
                        mt-3
                        w-full
                        max-w-[220px]
                        rounded-full
                        bg-pink-400
                        px-6
                        py-3
                        text-center
                        font-semibold
                        text-white
                        transition
                        duration-300
                        hover:scale-105
                        hover:bg-pink-500
                        active:scale-95
                    "
                    href=""
                >
                    кошкодевачка ♡
                </a>

            </div>


            <!-- Главная -->

            <a
                class="
                    absolute
                    bottom-5
                    left-1/2
                    -translate-x-1/2
                    text-2xl
                    font-extrabold
                    text-white
                    drop-shadow-2xl
                    transition
                    duration-300
                    hover:text-blue-700

                    sm:text-3xl
                "
                href="index.html"
            >
                Главная
            </a>

        </div>
    </main>

</body>

</html>
