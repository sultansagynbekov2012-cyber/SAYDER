<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>SAYDERSITE</title>

   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

   <main>
      <div class="
            relative
            flex
            min-h-screen
            w-full
            items-center
            justify-center
            overflow-hidden
            bg-gradient-to-br
            from-pink-300
            via-purple-300
            to-blue-600
            px-4
            py-8
        ">

         <!-- Декоративные элементы -->

         <div class="
                absolute
                left-4
                top-10
                text-3xl
                sm:left-10
                sm:top-20
                sm:text-4xl
                md:left-20
            ">
            ♡
         </div>

         <div class="
                absolute
                right-4
                top-20
                text-2xl
                sm:right-10
                sm:top-32
                sm:text-3xl
                md:right-20
            ">
            ✦
         </div>

         <div class="
                absolute
                bottom-16
                left-4
                text-4xl
                sm:left-10
                sm:text-5xl
                md:left-20
            ">
            ♡
         </div>

         <div class="
                absolute
                bottom-10
                right-4
                text-3xl
                sm:right-10
                sm:bottom-20
                sm:text-4xl
                md:right-20
            ">
            ✧
         </div>


         <!-- Карточка -->

         <div class="
                relative
                flex
                w-full
                max-w-xs
                flex-col
                items-center
                overflow-hidden
                rounded-3xl
                border
                border-white/60
                bg-white/90
                p-4
                shadow-2xl
                backdrop-blur-sm
                transition
                duration-300

                sm:max-w-sm
                sm:p-5

                md:max-w-md
                md:p-6
                md:hover:scale-105
                md:hover:shadow-pink-500/40
            ">


            <!-- Картинка -->

            <img class="
                        w-full
                        max-w-[220px]
                        aspect-square
                        rounded-2xl
                        border-2
                        border-white
                        object-cover
                        shadow-lg

                        sm:max-w-[240px]

                        md:max-w-[260px]
                    " src="https://i.pinimg.com/736x/96/c0/0f/96c00f29e39bfff0611eefa45da79fa4.jpg" alt="Фото">


            <!-- Заголовок -->

            <h2 class="
                    mt-4
                    text-center
                    text-xl
                    font-bold
                    text-gray-800

                    sm:text-2xl
                ">
               Нажми сюда 👇
            </h2>


            <!-- Кнопка -->

            <a href="bebebe.html" class="
                        mt-3
                        w-full
                        max-w-[190px]
                        rounded-full
                        bg-pink-400
                        px-6
                        py-3
                        text-center
                        font-semibold
                        text-white
                        transition
                        duration-300
                        hover:bg-pink-500
                        hover:scale-105
                        active:scale-95
                    ">
               Сюда ♡
            </a>

         </div>

      </div>
   </main>

</body>

</html>
