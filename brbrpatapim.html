<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAYDERSITE</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <main>
        <div class="
            relative
            flex
            min-h-screen
            w-full
            items-center
            justify-center
            overflow-hidden
            bg-gradient-to-br
            from-pink-300
            via-purple-300
            to-blue-600
            px-4
        ">

            <!-- Декоративные элементы -->

            <div class="
                absolute
                left-5
                top-10
                text-3xl
                animate-bounce

                sm:left-10
                sm:top-20
                sm:text-4xl

                md:left-20
            ">
                ♡
            </div>

            <div class="
                absolute
                right-5
                top-20
                text-2xl

                sm:right-10
                sm:top-32
                sm:text-3xl

                md:right-20
            ">
                ✦
            </div>

            <div class="
                absolute
                bottom-20
                left-5
                text-4xl

                sm:left-10
                sm:text-5xl

                md:left-20
            ">
                ♡
            </div>

            <div class="
                absolute
                bottom-16
                right-5
                text-3xl

                sm:right-10
                sm:text-4xl

                md:right-20
            ">
                ✧
            </div>


            <!-- Текст -->

            <p class="
                text-center
                text-3xl
                font-bold
                text-white
                drop-shadow-lg

                sm:text-4xl

                md:text-5xl
            ">
                Здесь ничего нет ☺
            </p>


            <!-- Главная -->

            <a
                class="
                    absolute
                    bottom-5
                    left-1/2
                    -translate-x-1/2
                    text-2xl
                    font-extrabold
                    text-white
                    drop-shadow-2xl
                    transition
                    duration-300
                    hover:text-blue-700

                    sm:text-3xl
                "
                href="index.html"
            >
                Главная
            </a>

        </div>
    </main>

</body>

</html>
